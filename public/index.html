<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FLL 2027 Postup</title>
  <meta name="description" content="Sledujte postup našeho týmu v sezóně FIRST LEGO League 2026/2027.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧱</text></svg>">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="hero">
    <p class="eyebrow" id="season">FIRST LEGO League</p>
    <h1 id="team">Náš FLL tým</h1>
    <img class="hero-photo" src="/team-2025.jpg" alt="Náš tým z loňské sezóny FLL" width="1600" height="900" loading="eager">
    <div class="overall">
      <div class="bar"><div class="fill" id="overall-fill"></div></div>
      <p><strong id="overall-pct">0%</strong> z našich sezónních cílů splněno</p>
    </div>
    <p class="countdown" id="countdown"></p>
  </header>

  <main>
    <section>
      <h2>Postup</h2>
      <div class="grid" id="areas"></div>
    </section>

    <section>
      <h2>Deník týmu</h2>
      <ol class="log" id="log"></ol>
    </section>

    <section>
      <h2>Galerie</h2>
      <div class="gallery">
        <figure>
          <img src="/practice-session.jpg" alt="Trénink s robotem na herní ploše" width="1600" height="900" loading="lazy">
        </figure>
        <figure>
          <img src="/building-robot.jpg" alt="Stavění a programování robota" width="1600" height="2843" loading="lazy">
        </figure>
      </div>
    </section>
  </main>

  <footer>
    <p>Poslední aktualizace <span id="updated">—</span></p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
