<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FLL 2027 Progress</title>
  <meta name="description" content="Follow our team's progress in the FIRST LEGO League 2026/2027 season.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧱</text></svg>">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="hero">
    <p class="eyebrow" id="season">FIRST LEGO League</p>
    <h1 id="team">Our FLL Team</h1>
    <img class="hero-photo" src="/team-2025.jpg" alt="Our team from last year's FLL season" width="1600" height="900" loading="eager">
    <div class="overall">
      <div class="bar"><div class="fill" id="overall-fill"></div></div>
      <p><strong id="overall-pct">0%</strong> of our season goals done</p>
    </div>
    <p class="countdown" id="countdown"></p>
  </header>

  <main>
    <section>
      <h2>Progress</h2>
      <div class="grid" id="areas"></div>
    </section>

    <section>
      <h2>Team log</h2>
      <ol class="log" id="log"></ol>
    </section>
  </main>

  <footer>
    <p>Last updated <span id="updated">—</span></p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
